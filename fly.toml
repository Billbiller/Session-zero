# fly.toml app configuration file generated for session-zero-8cuvzw on 2026-09-20T15:17:15Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'session-zero-8cuvzw'
primary_region = 'lax'

[build]

[env]
  # The Next.js server (`next start`) reads PORT itself and otherwise
  # defaults to 3000 -- nothing else in this generated config told it to
  # listen on the 8080 the [http_service] block below routes to, so
  # without this the app would build and "deploy" but never actually
  # answer any request.
  PORT = '8080'
  # lib/db.ts reads SQLITE_DB_PATH; the Fly launch template generated a
  # DATABASE_URL env var in the Dockerfile instead, which this app never
  # reads. Without this, the app falls back to a path under /app (its
  # working directory) -- which is NOT the /data volume mounted below --
  # so the database would silently reset on every restart/redeploy.
  SQLITE_DB_PATH = '/data/session-zero.db'

[[mounts]]
  source = 'data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  # The launch UI generated both `memory` and `memory_mb` here with
  # conflicting values (1gb vs 512) -- keeping only one, at 1GB, per the
  # earlier sizing recommendation (256-512MB is tight for Next.js +
  # better-sqlite3 under real concurrent load).
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
